    <!-- Complete Door Animation Styles with Wood Boxes Design -->
    <style>
      :root{
        --wood-dark:#4A2C1A;
        --wood-mid:#6B3E22;
        --wood-light:#8B5A34;
        --wood-grain:#3B2213;
        --brass:#D4AF37;
        --brass-dark:#9C7A1E;
      }
      *{box-sizing:border-box;margin:0;padding:0;}
      html,body{height:100%; width:100%; overflow-x: hidden;}
      body.locked{overflow:hidden; height:100vh;}

      #door-stage{
        position:fixed; inset:0; z-index:99999;
        perspective:2200px;
        background:linear-gradient(180deg,#2b1a10,#1c1009);
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #door-stage.done{display:none !important; visibility:hidden !important; pointer-events:none !important;}

      .door-frame{
        position:absolute; inset:0;
        background:radial-gradient(ellipse at 50% 30%, rgba(255,200,120,0.10), transparent 60%), linear-gradient(180deg,#3a2415,#241407);
      }

      /* Top Controls: Skip Button */
      .top-controls {
        position: absolute; top: 16px; right: 16px; z-index: 25;
        display: flex; gap: 10px; align-items: center;
      }
      .control-btn {
        background: rgba(20,10,45,0.75); backdrop-filter: blur(4px);
        border: 1px solid rgba(255,255,255,0.4); color: #fff;
        padding: 8px 18px; border-radius: 20px;
        font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500;
        cursor: pointer; display: flex; align-items: center; gap: 6px;
        transition: background 0.2s, transform 0.2s;
      }
      .control-btn:hover { background: rgba(40,20,70,0.95); transform: scale(1.03); }

      .frame-pillar{
        position:absolute; top:0; bottom:0; width:26px; z-index:6;
        background:repeating-linear-gradient(180deg, #6B3E22 0px, #4A2C1A 18px, #6B3E22 36px);
      }
      .frame-pillar.left{ left:0; }
      .frame-pillar.right{ right:0; }

      /* 3D Doors Styling & Animation */
      .door{
        position:absolute; top:0; bottom:0; width:50%;
        background:linear-gradient(90deg, var(--wood-dark) 0%, var(--wood-light) 12%, var(--wood-mid) 30%, var(--wood-light) 55%, var(--wood-mid) 78%, var(--wood-dark) 100%);
        transition: transform 1.6s cubic-bezier(.72,-0.15,.24,1.05);
        will-change: transform;
        z-index: 10;
        box-shadow: inset 0 0 90px rgba(0,0,0,0.6);
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        padding: 40px 30px;
        box-sizing: border-box;
      }
      .door-left{ left:0; transform-origin:left center; border-right:2px solid var(--wood-grain); }
      .door-right{ right:0; transform-origin:right center; border-left:2px solid var(--wood-grain); }

      #door-stage.opened .door-left{ transform:rotateY(-112deg); }
      #door-stage.opened .door-right{ transform:rotateY(112deg); }
      #door-stage.opened .knock-wrap { display: none; }
      #door-stage.opened .toran,
      #door-stage.opened .door-kolam { opacity: 0; visibility: hidden; transition: opacity 0.3s ease; }

      /* Wood Panel Boxes Design & Animation inside Doors */
      .door-panel-container {
        display: grid;
        grid-template-rows: repeat(2, 1fr);
        gap: 20px;
        height: 80%;
        width: 100%;
        margin: auto;
      }
      .wood-box {
        border: 3px inset var(--wood-grain);
        background: rgba(45, 25, 12, 0.4);
        box-shadow: inset 0 0 15px rgba(0,0,0,0.6), 0 2px 5px rgba(255,255,255,0.05);
        border-radius: 6px;
        animation: boxGlow 4s ease-in-out infinite alternate;
        position: relative;
      }
      @keyframes boxGlow {
        0% { border-color: #3B2213; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        100% { border-color: var(--brass-dark); box-shadow: inset 0 0 20px rgba(212,175,55,0.25); }
      }

      /* Toran Swaying Animation */
      .toran{
        position:absolute; top:0; left:0; width:100%; height:140px;
        z-index:15; pointer-events:none;
        animation: toranSway 4.5s ease-in-out infinite;
        transform-origin: 50% 0%;
      }
      @keyframes toranSway{
        0%,100%{ transform:rotate(-0.8deg); }
        50%{ transform:rotate(0.8deg); }
      }
      .garland-line{
        stroke-dasharray: 3 9;
        animation: garlandFlow 2.6s linear infinite;
      }
      @keyframes garlandFlow{
        to{ stroke-dashoffset:-24; }
      }

      /* Kolam Glow Animation */
      .door-kolam {
        position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
        width: 240px; height: 75px; z-index: 15; pointer-events: none;
        filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7));
        animation: kolamGlow 3s ease-in-out infinite alternate;
      }
      @keyframes kolamGlow {
        0% { opacity: 0.8; filter: drop-shadow(0 2px 4px rgba(255,215,0,0.3)); }
        100% { opacity: 1; filter: drop-shadow(0 2px 10px rgba(255,215,0,0.8)); }
      }

      /* Bulb Glow Animation */
      .bulb-glow {
        animation: bulbGlow 2s ease-in-out infinite alternate;
      }
      @keyframes bulbGlow {
        0% { fill: var(--brass-dark); filter: drop-shadow(0 0 2px rgba(212,175,55,0.4)); }
        100% { fill: #fff4d0; filter: drop-shadow(0 0 8px rgba(255,223,128,0.9)); }
      }

      /* Knock Button, Wiggle & Ring Spin Animations */
      .knock-wrap{
        position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
        z-index:20; display:flex; flex-direction:column; align-items:center;
      }
      .knock-btn{
        width:90px; height:90px; border-radius:50%;
        border:3px solid var(--brass-dark);
        background:radial-gradient(circle at 35% 30%, #f6e2a0, var(--brass) 55%, var(--brass-dark) 100%);
        box-shadow:0 6px 18px rgba(0,0,0,0.55);
        display:flex; align-items:center; justify-content:center;
        cursor:pointer;
        z-index: 5;
        position: relative;
      }
      .knock-btn svg{ animation: iconWiggle 2.6s ease-in-out infinite; transform-origin:50% 78%; }
      @keyframes iconWiggle{
        0%,100%{ transform:rotate(0deg); }
        25%{ transform:rotate(-9deg); }
        75%{ transform:rotate(9deg); }
      }

      .ring-spin {
        position: absolute;
        top: -8px; left: -8px; right: -8px; bottom: -8px;
        border: 2px dashed var(--brass);
        border-radius: 50%;
        animation: ringSpin 8s linear infinite;
        pointer-events: none;
      }
      @keyframes ringSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .sway-outer{
        transform-box: fill-box;
        transform-origin: 50% 0%;
        animation: leafSway 2.6s ease-in-out infinite;
      }
      @keyframes leafSway{
        0%,100%{ transform:rotate(-6deg); }
        50%{ transform:rotate(6deg); }
      }
    </style>

    <!-- Dynamic Toran Generator & Animation Script -->
    <script>
      const SVGNS = 'http://www.w3.org/2000/svg';
      function el(tag, attrs){
        const n = document.createElementNS(SVGNS, tag);
        for(const k in attrs) n.setAttribute(k, attrs[k]);
        return n;
      }
      function rnd(min,max){ return min + Math.random()*(max-min); }
      
      function mangoLeaf(x,y,rot,scale,shade){
        const g = el('g',{transform:`translate(${x},${y}) rotate(${rot}) scale(${scale})`, filter:'url(#softShadow)'});
        const id = 'lg'+Math.round(x)+Math.round(y);
        const defs = el('defs',{});
        const grad = el('linearGradient',{id:id, x1:'0%', y1:'0%', x2:'100%', y2:'100%'});
        grad.appendChild(el('stop',{offset:'0%','stop-color':'#6b9a5c'}));
        grad.appendChild(el('stop',{offset:'55%','stop-color':shade}));
        grad.appendChild(el('stop',{offset:'100%','stop-color':'#2f4b28'}));
        defs.appendChild(grad);
        g.appendChild(defs);
        g.appendChild(el('path',{
          d:'M0,0 C-6,-9 -5,-22 0,-32 C5,-22 6,-9 0,0 Z',
          fill: `url(#${id})`, stroke:'#26401f', 'stroke-width':'0.5'
        }));
        return g;
      }

      function marigold(x,y,scale,outer,inner){
        const g = el('g',{transform:`translate(${x},${y}) scale(${scale}) rotate(${rnd(-12,12)})`, filter:'url(#softShadow)'});
        for(let i=0;i<10;i++){
          const a = (i/10)*Math.PI*2;
          const r = 6*rnd(0.9,1.1);
          g.appendChild(el('ellipse',{
            cx:Math.cos(a)*r, cy:Math.sin(a)*r, rx:4.2, ry:2.6,
            transform:`rotate(${a*180/Math.PI} ${Math.cos(a)*r} ${Math.sin(a)*r})`,
            fill: outer
          }));
        }
        g.appendChild(el('circle',{ cx:0, cy:0, r:2, fill:'#7A4A0E' }));
        return g;
      }

      function swingWrap(innerG, phase){
        const wrap = el('g',{
          class:'sway-outer',
          style:`animation-delay:${(phase*0.12).toFixed(2)}s;`
        });
        wrap.appendChild(innerG);
        return wrap;
      }

      (function(){
        const leavesG = document.getElementById('leaves');
        const flowersG = document.getElementById('flowers');
        if(!leavesG || !flowersG) return;
        const spanW = 1400;
        const totalItems = 32;
        for(let i=0; i<totalItems; i++){
          const t = i / (totalItems - 1);
          const x = -20 + t * (spanW + 40);
          const localT = t * 2 - 1;
          const y = 18 + 55 * (1 - localT * localT);
          
          if(i % 2 === 0){
            const rot = -40 + t * 80 + rnd(-5,5);
            const shade = (i % 4 === 0) ? '#4F7942' : '#3F6636';
            leavesG.appendChild(swingWrap(mangoLeaf(x, y, rot, rnd(0.85,1.1), shade), i));
          } else {
            const outer = (i % 3 === 1) ? '#E8871E' : '#F4A93F';
            const inner = (i % 3 === 1) ? '#F4A93F' : '#FFD27A';
            flowersG.appendChild(swingWrap(marigold(x, y + 8, rnd(0.85,1.05), outer, inner), i));
          }
        }
      })();

      const stage = document.getElementById('door-stage');
      const knockBtn = document.getElementById('knockBtn');
      const skipBtn = document.getElementById('skipBtn');

      function closeDoorAndShowWebsite() {
        if(!stage) return;
        stage.classList.add('done');
        document.body.classList.remove('locked');
        setTimeout(() => {
          stage.remove();
        }, 100);
      }

      function openDoors(){
        if(!stage || stage.classList.contains('opened')) return;
        stage.classList.add('opened');
        document.body.classList.remove('locked');
        setTimeout(() => {
          stage.remove();
        }, 1600);
      }

      if(skipBtn){
        skipBtn.addEventListener('click', closeDoorAndShowWebsite);
      }

      if(knockBtn){
        knockBtn.addEventListener('click', openDoors);
        knockBtn.addEventListener('keydown', (e)=>{
          if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openDoors(); }
        });
      }
    </script>
