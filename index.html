<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookMyHomez — Your Happy Home Partner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Vapi Web SDK Script -->
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js" defer async></script>
    
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          if (window.vapiSDK) {
            window.vapiSDK.run({
              apiKey: "32ef4e94-38fd-432a-9607-95da4cf1ald1",
              assistant: "2ea07536-f0d0-46e3-be3a-bdef97deda92",
              config: {
                position: "bottom-left",
                offset: "20px",
                width: "50px",
                height: "50px",
                idle: { color: "rgb(29, 78, 216)" },
                active: { color: "rgb(255, 0, 0)" }
              }
            });
          }
        }, 1000);
      });
    </script>
  </body>
</html>
