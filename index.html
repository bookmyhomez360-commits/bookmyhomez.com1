<!doctype html>
<html lang="en">
  <head>
    <!-- BookMyHomez — Complete On-Page SEO Code -->
    <title>BookMyHomez — Vacation Home Rentals, Luxury Villas & Holiday Homes</title>
    <meta name="description" content="Find and book verified holiday homes, luxury beach villas, heritage havelis, and cozy apartments across India. Enjoy 100% verified hosts, best rate guarantee, and 24/7 guest support at BookMyHomez." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://bookmyhomez.com/" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>

    <!-- React Root -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ElevenLabs Voice Widget -->
    <elevenlabs-convai agent-id="agent_6801kz63zg6xfpa896c7p2jc3epx"></elevenlabs-convai>
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

    <!-- Direct Welcome Voice Logic -->
    <script>
      let selectedVoice = null;

      function loadVoices() {
          if (!('speechSynthesis' in window)) return;
          const voices = window.speechSynthesis.getVoices();
          selectedVoice = voices.find(v => 
              (v.name.includes('Female') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Victoria') || v.name.includes('Google UK English Female') || v.name.includes('Google US English')) && v.lang.startsWith('en')
          ) || voices.find(v => v.lang.startsWith('en')) || voices[0];
      }

      if ('speechSynthesis' in window) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
          loadVoices();
      }

      function speakWelcomeMessage() {
          if (!('speechSynthesis' in window)) return;
          window.speechSynthesis.cancel();

          const welcomeText = "Welcome to Bookmyhomez website. Here you can search for the property you need, or list your properties for free if you have any. Also, you can see a fill details option at the top. If you fill your details there, our agent will call you. Tell the agent your required property details, and we will contact you. Thanks for visiting Bookmyhomez.";
          
          const utterance = new SpeechSynthesisUtterance(welcomeText);
          if (selectedVoice) utterance.voice = selectedVoice;
          
          utterance.rate = 0.95; 
          utterance.pitch = 1.4; // Sweet feminine human tone
          utterance.lang = 'en-US';

          window.speechSynthesis.speak(utterance);
      }

      // Website open avvagane automatic ga welcome voice play avtundi
      window.addEventListener('DOMContentLoaded', () => {
          loadVoices();
          setTimeout(speakWelcomeMessage, 1000);
      });

      // Mobile / Laptop interaction fallback in case browser delays autoplay
      ['click', 'touchstart', 'keydown'].forEach(evt => {
          window.addEventListener(evt, () => {
              if (!window.speechSynthesis.speaking && !window.hasWelcomed) {
                  window.hasWelcomed = true;
                  speakWelcomeMessage();
              }
          }, { once: true });
      });
    </script>
  </body>
</html>
