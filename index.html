    <!-- Isolated Door Animation Styles -->
    <style>
      :root {
        --wood-dark: #3b2010;
        --wood-mid: #5a3319;
        --wood-light: #7a4422;
        --wood-grain: #271408;
        --brass: #D4AF37;
        --brass-dark: #9C7A1E;
      }
      body.locked { overflow: hidden; height: 100vh; margin: 0; }

      #door-stage {
        position: fixed; inset: 0; z-index: 99999;
        perspective: 2200px;
        background: linear-gradient(180deg, #1f120a, #0d0704);
        width: 100vw; height: 100vh; overflow: hidden;
      }
      #door-stage.done { display: none; }

      .door-frame {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 50% 30%, rgba(255,200,120,0.15), transparent 60%), linear-gradient(180deg,#2b180c,#140b05);
      }

      .frame-pillar {
        position: absolute; top: 0; bottom: 0; width: 26px; z-index: 6;
        background: repeating-linear-gradient(180deg, #5a3319 0px, #3b2010 18px, #5a3319 36px);
      }
      .frame-pillar.left { left: 0; }
      .frame-pillar.right { right: 0; }

      .door {
        position: absolute; top: 0; bottom: 0; width: 50%;
        background: linear-gradient(90deg, var(--wood-dark) 0%, var(--wood-light) 12%, var(--wood-mid) 30%, var(--wood-light) 55%, var(--wood-mid) 78%, var(--wood-dark) 100%);
        transition: transform 1.6s cubic-bezier(.72,-0.15,.24,1.05);
        will-change: transform;
      }
      .door-left { left: 0; transform-origin: left center; border-right: 2px solid var(--wood-grain); }
      .door-right { right: 0; transform-origin: right center; border-left: 2px solid var(--wood-grain); }

      #door-stage.opened .door-left { transform: rotateY(-112deg); }
      #door-stage.opened .door-right { transform: rotateY(112deg); }
      #door-stage.opened { opacity: 0; pointer-events: none; transition: opacity 0.6s 1.2s; }

      /* Toran Styles */
      .toran {
        position: absolute; top: 0; left: 0; width: 100%; height: 140px;
        z-index: 10; pointer-events: none;
        animation: toranSway 4.5s ease-in-out infinite;
        transform-origin: 50% 0%;
      }
      @keyframes toranSway {
        0%, 100% { transform: rotate(-0.8deg); }
        50% { transform: rotate(0.8deg); }
      }
      .garland-line {
        stroke-dasharray: 3 9;
        animation: garlandFlow 2.6s linear infinite;
      }
      @keyframes garlandFlow {
        to { stroke-dashoffset: -24; }
      }

      /* Serial / Hanging Lights on the Sides & Top */
      .string-lights {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 11; display: flex; justify-content: space-between;
      }
      .light-strand-side {
        position: absolute; top: 0; width: 20px; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: space-around;
      }
      .light-strand-side.left { left: 15px; }
      .light-strand-side.right { right: 15px; }
      
      .bulb {
        width: 10px; height: 14px; border-radius: 50%;
        animation: bulbGlow 1.2s ease-in-out infinite alternate;
      }
      .bulb:nth-child(odd) { background-color: #ff3333; box-shadow: 0 0 8px #ff3333; animation-delay: 0.2s; }
      .bulb:nth-child(even) { background-color: #ffd700; box-shadow: 0 0 8px #ffd700; animation-delay: 0.6s; }
      .bulb:nth-child(3n) { background-color: #33ccff; box-shadow: 0 0 8px #33ccff; animation-delay: 0.4s; }

      @keyframes bulbGlow {
        from { opacity: 0.4; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1.1); filter: brightness(1.4); }
      }

      /* 4 Boxes Inside Doors with Wood Animation and Gold Edges */
      .door-boxes-container {
        position: absolute; inset: 6% 10%;
        display: grid; grid-template-rows: 1fr 1fr; gap: 20px;
        pointer-events: none;
      }
      .door-box {
        position: relative;
        border: 3px solid var(--brass);
        border-radius: 6px;
        background: radial-gradient(circle, rgba(90,51,25,0.6) 0%, rgba(39,20,8,0.9) 100%);
        box-shadow: inset 0 0 12px rgba(0,0,0,0.8), 0 2px 5px rgba(0,0,0,0.5);
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }
      .wood-carved-pattern {
        width: 75%; height: 75%;
        border: 2px dashed var(--brass-dark);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        animation: boxPatternPulse 3s ease-in-out infinite;
      }
      .wood-carved-pattern::after {
        content: '';
        width: 50%; height: 50%;
        background: var(--wood-mid);
        transform: rotate(45deg);
        border: 1px solid var(--brass);
        animation: patternRotate 8s linear infinite;
      }
      @keyframes boxPatternPulse {
        0%, 100% { transform: scale(0.95); opacity: 0.7; }
        50% { transform: scale(1.02); opacity: 1; }
      }
      @keyframes patternRotate {
        from { transform: rotate(45deg); }
        to { transform: rotate(405deg); }
      }

      /* Animated Rangoli at Bottom Center */
      .door-bottom-rangoli {
        position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
        width: 110px; height: 55px; pointer-events: none; z-index: 15;
        display: flex; align-items: center; justify-content: center;
      }
      .rangoli-svg {
        width: 100%; height: 100%;
        animation: rangoliSpin 10s linear infinite;
      }
      @keyframes rangoliSpin {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.08); filter: drop-shadow(0 0 8px #ffaa00); }
        100% { transform: rotate(360deg) scale(1); }
      }

      /* Center House Knob / Button with Glow and Animation */
      .knock-wrap {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 20; display: flex; flex-direction: column; align-items: center;
      }
      .knock-btn {
        width: 95px; height: 95px; border-radius: 50%;
        border: 3px solid var(--brass-dark);
        background: radial-gradient(circle at 35% 30%, #fff2b2, var(--brass) 55%, var(--brass-dark) 100%);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.7), 0 6px 18px rgba(0,0,0,0.55);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        animation: circleGlowPulse 2s ease-in-out infinite;
      }
      @keyframes circleGlowPulse {
        0%, 100% { box-shadow: 0 0 10px rgba(212,175,55,0.4), 0 6px 18px rgba(0,0,0,0.55); }
        50% { box-shadow: 0 0 25px rgba(212,175,55,0.9), 0 6px 18px rgba(0,0,0,0.55); transform: scale(1.03); }
      }
      .knock-btn svg { animation: iconWiggle 2.6s ease-in-out infinite; transform-origin: 50% 78%; }
      @keyframes iconWiggle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-9deg); }
        75% { transform: rotate(9deg); }
      }

      .sway-outer {
        transform-box: fill-box;
        transform-origin: 50% 0%;
        animation: leafSway 2.6s ease-in-out infinite;
      }
      @keyframes leafSway {
        0%, 100% { transform: rotate(-6deg); }
        50% { transform: rotate(6deg); }
      }
    </style>

    <!-- Dynamic Toran Generator Script -->
    <script>
      const SVGNS = 'http://www.w3.org/2000/svg';
      function el(tag, attrs){
        const n = document.createElementNS(SVGNS, tag);
        for(const k in attrs) n.setAttribute(k, attrs[k]);
        return n;
      }
      function rnd(min,max){ return min + Math.random()*(max-min); }
      
      function mangoLeaf(x,y,rot,scale,shade){
        const g = el('g',{transform:`translate(${x},${y}) rotate(${rot}) scale(${scale})`, filter:'url(#softShadow)'});
        const id = 'lg'+Math.round(x)+Math.round(y);
        const defs = el('defs',{});
        const grad = el('linearGradient',{id:id, x1:'0%', y1:'0%', x2:'100%', y2:'100%'});
        grad.appendChild(el('stop',{offset:'0%','stop-color':'#6b9a5c'}));
        grad.appendChild(el('stop',{offset:'55%','stop-color':shade}));
        grad.appendChild(el('stop',{offset:'100%','stop-color':'#2f4b28'}));
        defs.appendChild(grad);
        g.appendChild(defs);
        g.appendChild(el('path',{
          d:'M0,0 C-6,-9 -5,-22 0,-32 C5,-22 6,-9 0,0 Z',
          fill: `url(#${id})`, stroke:'#26401f', 'stroke-width':'0.5'
        }));
        return g;
      }

      function marigold(x,y,scale,outer,inner){
        const g = el('g',{transform:`translate(${x},${y}) scale(${scale}) rotate(${rnd(-12,12)})`, filter:'url(#softShadow)'});
        for(let i=0;i<10;i++){
          const a = (i/10)*Math.PI*2;
          const r = 6*rnd(0.9,1.1);
          g.appendChild(el('ellipse',{
            cx:Math.cos(a)*r, cy:Math.sin(a)*r, rx:4.2, ry:2.6,
            transform:`rotate(${a*180/Math.PI} ${Math.cos(a)*r} ${Math.sin(a)*r})`,
            fill: outer
          }));
        }
        g.appendChild(el('circle',{ cx:0, cy:0, r:2, fill:'#7A4A0E' }));
        return g;
      }

      function swingWrap(innerG, phase){
        const wrap = el('g',{
          class:'sway-outer',
          style:`animation-delay:${(phase*0.12).toFixed(2)}s;`
        });
        wrap.appendChild(innerG);
        return wrap;
      }

      (function(){
        const leavesG = document.getElementById('leaves');
        const flowersG = document.getElementById('flowers');
        if(!leavesG || !flowersG) return;
        const spanW = 1400;
        const totalItems = 32;
        for(let i=0; i<totalItems; i++){
          const t = i / (totalItems - 1);
          const x = -20 + t * (spanW + 40);
          const localT = t * 2 - 1;
          const y = 18 + 55 * (1 - localT * localT);
          
          if(i % 2 === 0){
            const rot = -40 + t * 80 + rnd(-5,5);
            const shade = (i % 4 === 0) ? '#4F7942' : '#3F6636';
            leavesG.appendChild(swingWrap(mangoLeaf(x, y, rot, rnd(0.85,1.1), shade), i));
          } else {
            const outer = (i % 3 === 1) ? '#E8871E' : '#F4A93F';
            const inner = (i % 3 === 1) ? '#F4A93F' : '#FFD27A';
            flowersG.appendChild(swingWrap(marigold(x, y + 8, rnd(0.85,1.05), outer, inner), i));
          }
        }
      })();

      const stage = document.getElementById('door-stage');
      const knockBtn = document.getElementById('knockBtn');

      function openDoors(){
        if(!stage || stage.classList.contains('opened')) return;
        stage.classList.add('opened');
        document.body.classList.remove('locked');
        setTimeout(()=>{ stage.remove(); }, 1800);
      }

      if(knockBtn){
        knockBtn.addEventListener('click', openDoors);
        knockBtn.addEventListener('keydown', (e)=>{
          if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openDoors(); }
        });
      }
    </script>
