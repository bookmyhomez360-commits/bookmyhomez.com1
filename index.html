<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BookMyHomez</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root{
        --wood-dark:#4A2C1A; --wood-mid:#6B3E22; --wood-light:#8B5A34; --wood-grain:#3B2213;
        --brass:#D4AF37; --brass-dark:#9C7A1E;
      }
      *{box-sizing:border-box;margin:0;padding:0;}
      html,body{height:100%;width:100%;overflow-x:hidden;}
      body.locked{overflow:hidden !important;height:100vh !important;}

      /* Door Stage Overlay - Always on top */
      #door-stage{
        position:fixed; inset:0; z-index:999999;
        perspective:2200px;
        background:linear-gradient(180deg,#2b1a10,#1c1009);
        width:100vw; height:100vh;
        overflow:hidden;
        display:flex; align-items:center; justify-content:center;
      }
      #door-stage.done{display:none !important;}

      .door-frame{position:absolute; inset:0; background:radial-gradient(ellipse at 50% 30%, rgba(255,200,120,0.10), transparent 60%), linear-gradient(180deg,#3a2415,#241407);}

      /* Background Video */
      .inner-screen-bg {
        position:absolute; inset:0; z-index:1; background:#000;
        width:100vw; height:100vh; display:flex; align-items:center; justify-content:center;
      }
      .poster video {
        position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
        width:100%; height:100%; object-fit:cover; z-index:2;
      }
      
      .top-controls { position:absolute; top:16px; right:16px; z-index:25; }
      .control-btn {
        background:rgba(20,10,45,0.75); backdrop-filter:blur(4px);
        border:1px solid rgba(255,255,255,0.4); color:#fff;
        padding:8px 18px; border-radius:20px; cursor:pointer;
        font-family:sans-serif; font-size:13px; font-weight:500;
      }

      .frame-pillar{position:absolute; top:0; bottom:0; width:26px; z-index:6; background:repeating-linear-gradient(180deg, #6B3E22 0px, #4A2C1A 18px, #6B3E22 36px);}
      .frame-pillar.left{left:0;} .frame-pillar.right{right:0;}

      .door{
        position:absolute; top:0; bottom:0; width:50%;
        background:linear-gradient(90deg, var(--wood-dark) 0%, var(--wood-light) 12%, var(--wood-mid) 30%, var(--wood-light) 55%, var(--wood-mid) 78%, var(--wood-dark) 100%);
        transition: transform 1.6s cubic-bezier(.72,-0.15,.24,1.05);
        will-change: transform; z-index:10;
      }
      .door-left{left:0; transform-origin:left center; border-right:2px solid var(--wood-grain);}
      .door-right{right:0; transform-origin:right center; border-left:2px solid var(--wood-grain);}

      #door-stage.opened .door-left{ transform:rotateY(-112deg); }
      #door-stage.opened .door-right{ transform:rotateY(112deg); }
      #door-stage.opened .knock-wrap, #door-stage.opened .toran, #door-stage.opened .door-kolam { display:none; }

      .knock-wrap{
        position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
        z-index:20; width:140px; height:140px; display:flex; align-items:center; justify-content:center;
      }
      .knock-btn{
        width:90px; height:90px; border-radius:50%; border:3px solid var(--brass-dark);
        background:radial-gradient(circle at 35% 30%, #f6e2a0, var(--brass) 55%, var(--brass-dark) 100%);
        cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:5;
      }
    </style>
  </head>
  <body class="locked">

    <!-- DOOR STAGE (Must be at the very top of body) -->
    <div id="door-stage">
      <div class="door-frame"></div>

      <div class="top-controls">
        <button class="control-btn" id="skipBtn" type="button">Skip</button>
      </div>

      <div class="inner-screen-bg">
        <div class="poster">
          <video id="v" playsinline webkit-playsinline preload="auto">
            <source src="/video-desktop.mp4" type="video/mp4">
            మీ బ్రౌజర్ వీడియోను సపోర్ట్ చేయడం లేదు.
          </video>
        </div>
      </div>

      <div class="frame-pillar left"></div>
      <div class="frame-pillar right"></div>

      <div class="door door-left"></div>
      <div class="door door-right"></div>

      <div class="knock-wrap" id="knockWrap">
        <div class="knock-btn" id="knockBtn">
          🚪
        </div>
      </div>
    </div>

    <!-- React App Root Container -->
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      const stage = document.getElementById('door-stage');
      const knockBtn = document.getElementById('knockBtn');
      const skipBtn = document.getElementById('skipBtn');
      const v = document.getElementById('v');

      window.addEventListener('DOMContentLoaded', () => {
        if(v) v.pause();
      });

      function removeDoor() {
        if(!stage) return;
        stage.style.transition = "opacity 0.6s ease";
        stage.style.opacity = "0";
        setTimeout(() => {
          stage.classList.add('done');
          document.body.classList.remove('locked');
          stage.remove();
        }, 600);
      }

      function openDoors(){
        if(!stage || stage.classList.contains('opened')) return;
        stage.classList.add('opened');
        if(v) {
          v.muted = false;
          v.play().catch(() => {});
        }
      }

      if(skipBtn) {
        skipBtn.addEventListener('click', () => {
          openDoors();
          setTimeout(removeDoor, 1000);
        });
      }

      if(knockBtn) {
        knockBtn.addEventListener('click', openDoors);
      }

      if(v) {
        v.addEventListener('ended', removeDoor);
      }
    </script>
  </body>
</html>
