name: Autonomous AI SEO Agent

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  seo-agent-job:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Google AI SDK
        run: npm install @google/generative-ai

      - name: Run SEO Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/seo-agent.js

      - name: Direct Git Push Metadata
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/seo-metadata.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 AI SEO Agent: Updated metadata [skip ci]" && git push)
