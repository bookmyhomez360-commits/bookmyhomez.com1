    <!-- First paint: a BookMyHomez logo splash sits ON TOP of the page until the app is ready.
         The crawlable page content inside #root is never hidden with CSS (no display:none /
         visibility / opacity on it) - it is simply covered for a moment by this overlay, which
         the app removes as soon as it has drawn the real page (failsafe: 8 s; without JavaScript
         the overlay is not shown at all). Same look as the logo intro, so there is one logo moment. -->
    <link rel="preload" as="image" href="/brand/bmh-logo.webp" type="image/webp" fetchpriority="high" />
    <style>
      html, body { background: #090D16; }
      #bmh-splash { position: fixed; inset: 0; z-index: 2147483647; display: flex; align-items: center; justify-content: center; padding: 24px;
        background: radial-gradient(60% 45% at 50% 48%, rgba(124,58,237,.55), rgba(76,29,149,.25) 55%, transparent 80%), #0b0820;
        transition: opacity .26s ease, visibility .26s; cursor: pointer; }
      #bmh-splash.is-leaving { opacity: 0; visibility: hidden; }
      #bmh-splash .bmh-s-card { position: relative; width: min(72vw, 330px); aspect-ratio: 520 / 479; box-sizing: content-box; padding: 14px 16px;
        border-radius: 24px; border: 3px solid transparent; overflow: hidden; }
      /* the white card appears together with the logo picture (never an empty card); transform-only animation
         so the logo counts as the first big paint */
      #bmh-splash.ready .bmh-s-card { background: #fff; border-color: #f2b705;
        box-shadow: 0 0 0 6px rgba(242,183,5,.18), 0 24px 60px rgba(0,0,0,.55), 0 0 90px rgba(124,58,237,.55);
        animation: bmhSCard .5s cubic-bezier(.2,1.4,.4,1) both; }
      #bmh-splash.is-leaving .bmh-s-card { transform: scale(.94); transition: transform .26s ease; }
      #bmh-splash img { display: block; width: 100%; height: 100%; object-fit: contain; }
      #bmh-splash .bmh-s-shine { position: absolute; inset: -20% auto -20% -60%; width: 45%; pointer-events: none; transform: skewX(-18deg);
        background: linear-gradient(100deg, transparent, rgba(255,255,255,.85), transparent); }
      #bmh-splash.ready .bmh-s-shine { animation: bmhSShine .6s ease-in-out .45s both; }
      html.bmh-splash-on elevenlabs-convai { visibility: hidden; }
      @keyframes bmhSCard { from { transform: scale(.86) translateY(8px); } to { transform: none; } }
      @keyframes bmhSShine { from { left: -60%; } to { left: 130%; } }
      @media (prefers-reduced-motion: reduce) { #bmh-splash.ready .bmh-s-card, #bmh-splash.ready .bmh-s-shine { animation: none; } }
    </style>
    <noscript><style>#bmh-splash { display: none !important; }</style></noscript>

  <body>
    <div id="bmh-splash" aria-hidden="true"><div class="bmh-s-card"><img src="/brand/bmh-logo.webp" width="520" height="479" alt="" decoding="sync" fetchpriority="high" onload="this.closest('#bmh-splash').classList.add('ready')" onerror="this.closest('#bmh-splash').classList.add('ready')" /><span class="bmh-s-shine"></span></div></div>
    <script>
      // The app removes the splash itself (LogoIntro). Failsafe so it can never stay up.
      (function () {
        document.documentElement.classList.add('bmh-splash-on');
        window.__bmhSplashT0 = Date.now();
        function hide() {
          var s = document.getElementById('bmh-splash');
          document.documentElement.classList.remove('bmh-splash-on');
          if (!s) return;
          s.classList.add('is-leaving');
          setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 300);
        }
        window.__bmhHideSplash = hide;
        // show the logo card as soon as its picture is ready (never an empty white card); 1.5 s at the latest
        var s0 = document.getElementById('bmh-splash');
        var im = s0 && s0.querySelector('img');
        if (im && im.complete) s0.classList.add('ready');
        setTimeout(function () { if (s0) s0.classList.add('ready'); }, 1500);
        setTimeout(hide, 8000);
      })();
    </script>
    <!-- React Root (the build step pre-fills this with crawlable content for each page) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Welcome voice (restored Oct 31 2026 — the original site played /welcome.mp3 when it opened;
         it was dropped by mistake in the Oct 30 SEO commit). Same file, same moment: tries 0.8 s
         after the page opens; if the browser blocks sound until the visitor touches the page, it
         plays on the first tap / click / key instead. Plays once per visit. -->
    <audio id="welcomeAudio" src="/welcome.mp3" preload="none"></audio>
    <script>
      (function () {
        var audio = document.getElementById('welcomeAudio');
        var started = false;
        function playHumanVoice() {
          if (!audio || started) return;
          var p = audio.play();
          if (p && p.then) {
            p.then(function () { started = true; window.__bmhVoice = 'playing'; })
             .catch(function () { window.__bmhVoice = 'blocked-waiting-for-tap'; });
          } else { started = true; }
        }
        function onFirstTouch() {
          playHumanVoice();
          if (started) ['click', 'touchend', 'keydown'].forEach(function (e) { window.removeEventListener(e, onFirstTouch); });
        }
        // Website open avvagane voice play cheyyadaniki try chestundi
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () { setTimeout(playHumanVoice, 800); });
        } else { setTimeout(playHumanVoice, 800); }
        // Mobile lo touch cheyagane voice play avvadaniki fallback
        ['click', 'touchend', 'keydown'].forEach(function (e) { window.addEventListener(e, onFirstTouch, { passive: true }); });
      })();
    </script>

    <!-- ElevenLabs Voice Widget (no autoplay audio). Its ~465 KB script loads on the visitor's first
         scroll/tap/key, or 8 s after the page has loaded, so it never slows down the first paint. -->
    <elevenlabs-convai agent-id="agent_6801kz63zg6xfpa896c7p2jc3epx"></elevenlabs-convai>
    <script>
      (function () {
        var done = false;
        function load() {
          if (done) return; done = true;
          var s = document.createElement('script');
          s.src = 'https://unpkg.com/@elevenlabs/convai-widget-embed';
          s.async = true;
          document.body.appendChild(s);
        }
        ['scroll', 'pointerdown', 'keydown', 'touchstart'].forEach(function (e) {
          window.addEventListener(e, load, { once: true, passive: true });
        });
        window.addEventListener('load', function () { setTimeout(load, 8000); });
      })();
    </script>
  </body>
