<!doctype html>
<html lang="en">
  <head>
    <!-- BookMyHomez — Complete On-Page SEO Code -->
    <title>BookMyHomez — Vacation Home Rentals, Luxury Villas & Holiday Homes</title>
    <meta name="description" content="Find and book verified holiday homes, luxury beach villas, heritage havelis, and cozy apartments across India. Enjoy 100% verified hosts, best rate guarantee, and 24/7 guest support at BookMyHomez." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://bookmyhomez.com/" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>

    <!-- Hidden Audio Element for Real Human Voice -->
    <audio id="welcomeAudio" src="/welcome.mp3" preload="auto"></audio>

    <!-- React Root -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ElevenLabs Voice Widget -->
    <elevenlabs-convai agent-id="agent_6801kz63zg6xfpa896c7p2jc3epx"></elevenlabs-convai>
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

    <!-- Real Human Voice Autoplay Logic -->
    <script>
      const audio = document.getElementById('welcomeAudio');

      function playHumanVoice() {
          if (audio) {
              audio.play().catch(error => {
                  console.log("Autoplay blocked, waiting for user interaction.");
              });
          }
      }

      // Website open avvagane voice play cheyyadaniki try chestundi
      window.addEventListener('DOMContentLoaded', () => {
          setTimeout(playHumanVoice, 800);
      });

      // Mobile lo touch cheyగానే voice play avvadaniki instant fallback
      ['click', 'touchstart', 'keydown'].forEach(evt => {
          window.addEventListener(evt, () => {
              if (audio && audio.paused) {
                  audio.play();
              }
          }, { once: true });
      });
    </script>
  </body>
</html>
